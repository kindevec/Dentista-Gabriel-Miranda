<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C378" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#997328" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Obsidian luxury background -->
  <rect width="64" height="64" rx="16" fill="#0D0D0D" stroke="#D4AF37" stroke-width="1.5" />

  <!-- Outer Fine Gold Circle -->
  <circle cx="32" cy="32" r="24" stroke="url(#goldRing)" stroke-width="1.8" />
  <circle cx="32" cy="32" r="21" stroke="url(#goldMetallic)" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Stylized M Monogram -->
  <path
    d="M 19 42 L 19 22 L 32 35 L 45 22 L 45 42"
    stroke="url(#goldMetallic)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Interlaced Arch -->
  <path
    d="M 24 42 C 24 29 40 29 40 42"
    stroke="url(#goldRing)"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Crest Diamond Accent -->
  <circle cx="32" cy="17" r="1.6" fill="url(#goldMetallic)" />
</svg>
